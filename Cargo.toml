[workspace]
resolver = "3"
members = ["collo", "crates/core", "crates/core-wasm", "crates/export", "crates/server"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
collo = { path = "collo", default-features = false }
loquaris-core = { path = "crates/core" }
loquaris-export = { path = "crates/export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.26"
unicode-segmentation = "1"

[profile.release.package.collo]
opt-level = 3

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
