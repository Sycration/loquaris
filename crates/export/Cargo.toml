[package]
name = "loquaris-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.4"
hound = "3"
loquaris-core.workspace = true
printpdf = { version = "0.12.8", default-features = false }
# Pinned with the desktop app's exact features: the archive layout depends on
# them, and old `.loqr` files must keep decoding.
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32"] }
sha2 = "0.11"
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
